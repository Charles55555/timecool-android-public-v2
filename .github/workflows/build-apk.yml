name: Build TimeCool APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Requis pour créer une Release et y attacher l'APK.
permissions:
  contents: write

env:
  # Base du numéro de version. Le numéro de run est ajouté pour obtenir
  # une version qui augmente à chaque build (ex : 2.0.42).
  APP_VERSION_BASE: "2.0"

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle & generate wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper jar
        run: gradle wrapper --gradle-version=8.7 --distribution-type=bin

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Calcule la version. github.run_number est monotone croissant :
      # il garantit un versionCode toujours supérieur au précédent.
      - name: Calculer la version
        id: version
        run: |
          echo "name=${APP_VERSION_BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Le keystore est stocké en secret, encodé en base64. Il est écrit
      # dans RUNNER_TEMP (hors du workspace) pour qu'il ne puisse jamais
      # se retrouver dans un artifact ou un commit.
      - name: Déchiffrer le keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 absent — APK non signé, aucune Release ne sera publiée."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/timecool.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.available == 'true' && format('{0}/timecool.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: ./gradlew assembleRelease --stacktrace

      # Nom de fichier volontairement fixe : l'URL permanente
      # releases/latest/download/timecool.apk en dépend.
      - name: Préparer l'APK
        run: |
          mkdir -p dist
          # Sans keystore, AGP nomme la sortie app-release-unsigned.apk.
          SRC=app/build/outputs/apk/release/app-release.apk
          [ -f "$SRC" ] || SRC=app/build/outputs/apk/release/app-release-unsigned.apk
          cp "$SRC" dist/timecool.apk
          ls -lh dist/timecool.apk

      - name: Vérifier la signature
        if: steps.keystore.outputs.available == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          "$APKSIGNER" verify --print-certs dist/timecool.apk

      - name: Upload APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeCool-${{ steps.version.outputs.name }}
          path: dist/timecool.apk
          retention-days: 30
          if-no-files-found: error

      # Publie la Release. L'asset garde toujours le même nom, donc
      # l'URL releases/latest/download/timecool.apk reste valable à vie.
      # workflow_dispatch est accepté au même titre qu'un push : sans
      # cela, un lancement manuel construisait l'APK sans jamais publier
      # de Release — seul recours quand GitHub n'a pas déclenché le build
      # automatique après un push.
      - name: Publier la Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.keystore.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            --title "TimeCool v${{ steps.version.outputs.name }}" \
            --notes "APK Android signé, installable par-dessus une version précédente sans désinstallation.

          versionCode : ${{ steps.version.outputs.code }}
          Commit : ${{ github.sha }}

          Téléchargement permanent (pointe toujours vers la dernière version) :
          https://github.com/${{ github.repository }}/releases/latest/download/timecool.apk" \
            dist/timecool.apk
