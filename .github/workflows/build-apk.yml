name: Build TimeCool APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurer JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Installer Gradle et générer le wrapper (avec le gradle-wrapper.jar)
      - name: Setup Gradle & generate wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper jar
        run: gradle wrapper --gradle-version=8.7 --distribution-type=bin

      # 4. Rendre gradlew exécutable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. Build APK Debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # 6. Uploader l'APK en artifact téléchargeable
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeCool-v2.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # 7. Créer une Release GitHub si c'est un push sur main avec tag
      - name: Get APK info
        if: success()
        run: |
          echo "✅ APK généré avec succès !"
          ls -lh app/build/outputs/apk/debug/
          echo "📦 Taille APK: $(du -sh app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
