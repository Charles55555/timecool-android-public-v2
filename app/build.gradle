plugins {
    id 'com.android.application'
}

/* Signature de release.
   Les identifiants ne sont jamais dans le dépôt : ils viennent de
   variables d'environnement alimentées par les secrets GitHub Actions.
   Si le keystore est absent (build local sans secrets), la config de
   signature n'est pas appliquée et le build produit un APK non signé
   plutôt que d'échouer. */
def keystorePath = System.getenv('KEYSTORE_FILE')
def hasKeystore = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

/* Résolus ici, hors du DSL : écrits directement dans le bloc
   defaultConfig, Groovy parserait « versionCode (a ?: b).toInteger() »
   comme « versionCode(a ?: b).toInteger() » et passerait une chaîne. */
def resolvedVersionCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
def resolvedVersionName = System.getenv('VERSION_NAME') ?: '2.0'

/* Horodatage du build, affiché dans l'app à côté du numéro de version
   (voir tcFormaterVersion() côté JS) — injecté par le CI en UTC, ISO
   8601, pour qu'un même build affiche la même heure quel que soit le
   fuseau de l'appareil qui l'affiche. À défaut (build local sans CI),
   l'heure du poste sert de repli plutôt que de faire échouer le build. */
def resolvedBuildTime = System.getenv('BUILD_TIME') ?:
    new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC'))

android {
    namespace 'com.timecool.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId "com.timecool.app"
        minSdk 26
        targetSdk 34

        /* versionCode doit STRICTEMENT augmenter à chaque publication,
           sinon Android refuse la mise à jour par-dessus l'installation
           existante. En CI il vaut le numéro de run GitHub Actions. */
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        buildConfigField "String", "BUILD_TIME", "\"${resolvedBuildTime}\""
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    /* Connexion Google native.
       Credential Manager remplace l'ancien Google Sign-In SDK. Cette voie
       a été retenue plutôt que de servir la page en https:// via
       WebViewAssetLoader : changer l'origine aurait efface tout le
       localStorage existant — contacts, RDV et reglages des utilisateurs
       deja installes. */
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    /* FileProvider, pour remettre l APK telecharge a l installateur
       d Android sous forme d URI content://. Arrive deja de facon
       transitive par credentials, mais une dependance utilisee
       directement doit etre declaree : une mise a jour de credentials
       pourrait sinon la faire disparaitre sans prevenir. */
    implementation 'androidx.core:core:1.13.1'
}
